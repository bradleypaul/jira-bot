[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jira-bot"
version = "0.2.0"
description = "Jira Cloud REST API client for reading tickets, planning, and starting work"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Paul Bradley" }]
dependencies = [
  "requests>=2.31.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
jira-bot = "jira_bot.cli:main"

[project.urls]
Homepage = "https://github.com/bradleypaul/jira-bot"
Repository = "https://github.com/bradleypaul/jira-bot"

[tool.setuptools.packages.find]
include = ["jira_bot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
