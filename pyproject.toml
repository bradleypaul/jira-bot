[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jira-bot"
version = "0.2.0"
description = "Takes a Jira ticket through a sandboxed coding agent to a tested draft pull request"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Paul Bradley" }]
dependencies = [
  "anthropic>=1.14.0",
  "requests>=2.31.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
# Installed in the agent container image, not on the host.
agent = ["claude-agent-sdk>=0.2.167"]
dev = ["pytest>=8.0", "claude-agent-sdk>=0.2.167"]

[project.scripts]
jira-bot = "jira_bot.cli:main"

[project.urls]
Homepage = "https://github.com/bradleypaul/jira-bot"
Repository = "https://github.com/bradleypaul/jira-bot"

[tool.setuptools.packages.find]
include = ["jira_bot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
